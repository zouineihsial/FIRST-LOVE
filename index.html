    <!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glowing Heartbeat</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
(function() {
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let t = 0;

    function drawHeart(scale, glow) {
        ctx.save();
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.moveTo(0, -50);
        ctx.bezierCurveTo(50, -100, 150, -20, 0, 100);
        ctx.bezierCurveTo(-150, -20, -50, -100, 0, -50);
        ctx.closePath();

        // Glow effect
        ctx.shadowColor = glow;
        ctx.shadowBlur = 40;
        ctx.fillStyle = glow;
        ctx.fill();
        ctx.restore();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);

        // Smooth heartbeat scale
        const scale = 1 + 0.08 * Math.sin(t);
        const glowColor = `hsl(${(Math.sin(t) * 10 + 350) % 360}, 80%, 60%)`;

        drawHeart(scale * 2, glowColor);

        ctx.restore();

        t += 0.08;
        requestAnimationFrame(animate);
    }

    animate();
})();
</script>
</body>
</html>
