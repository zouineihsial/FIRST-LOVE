  <!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beating Heart</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
(function() {
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas to fill window
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let t = 0; // time variable for animation

    function drawHeart(scale) {
        ctx.beginPath();
        ctx.moveTo(0, -50 * scale);
        ctx.bezierCurveTo(50 * scale, -100 * scale, 150 * scale, -20 * scale, 0, 100 * scale);
        ctx.bezierCurveTo(-150 * scale, -20 * scale, -50 * scale, -100 * scale, 0, -50 * scale);
        ctx.closePath();
        ctx.fillStyle = 'red';
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);

        // Heart beat scale factor
        const scale = 1 + 0.1 * Math.sin(t);
        drawHeart(scale);

        ctx.restore();

        t += 0.1; // speed of beating
        requestAnimationFrame(animate);
    }

    animate();
})();
</script>
</body>
</html>
