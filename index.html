<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighter and Princess Heart</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas sizing
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mathematical formula for the heart shape
        function heartFunction(t) {
            return {
                x: 16 * Math.pow(Math.sin(t), 3),
                y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
            };
        }

        // Particle template
        class Particle {
            constructor(x, y, size, speedX, speedY, life) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speedX = speedX;
                this.speedY = speedY;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                // Glowing effect using pink variations
                ctx.fillStyle = `rgba(255, 105, 180, ${this.life / this.maxLife})`;
                ctx.fill();
            }
        }

        const particles = [];
        let time = 0;

        function animate() {
            // Creates the glowing/trailing effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Adjust size scaling based on screen dimensions
            const scale = Math.min(canvas.width, canvas.height) / 40; 

            // Simulates beating expansion contraction
            const pulse = 1 + 0.15 * Math.sin(time * 5); 
            time += 0.05;

            // Generate main outer structural particles
            for (let i = 0; i < 5; i++) {
                const t = Math.random() * Math.PI * 2;
                const pos = heartFunction(t);
                
                const x = centerX + pos.x * scale * pulse;
                const y = centerY + pos.y * scale * pulse;

                // Drift speed outwards
                const speedX = (Math.random() - 0.5) * 1;
                const speedY = (Math.random() - 0.5) * 1;
                const size = Math.random() * 2 + 1;
                const life = Math.random() * 30 + 20;

                particles.push(new Particle(x, y, size, speedX, speedY, life));
            }

            // Generate inner filling particles
            if (Math.random() < 0.6) {
                const t = Math.random() * Math.PI * 2;
                const pos = heartFunction(t);
                const innerFactor = Math.random(); // Shrinks coordinates inward

                const x = centerX + pos.x * scale * pulse * innerFactor;
                const y = centerY + pos.y * scale * pulse * innerFactor;

                const speedX = (Math.random() - 0.5) * 0.5;
                const speedY = (Math.random() - 0.5) * 0.5;
                const size = Math.random() * 1.5 + 0.5;
                const life = Math.random() * 40 + 20;

                particles.push(new Particle(x, y, size, speedX, speedY, life));
            }

            // Process, update, and render particle array
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
